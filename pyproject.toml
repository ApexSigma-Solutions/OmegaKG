[project]
name = "omega-kg"
version = "0.1.0"
description = "General-purpose Python project managed by Poetry"
authors = [
    {name = "SigmaDev11",email = "steynsean11@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
]

packages = [
    { include = "src" }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"
pre-commit = "^4.3.0"
black = "^25.9.0"
ruff = "^0.14.1"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.22"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}
