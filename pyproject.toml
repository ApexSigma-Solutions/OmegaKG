[project]
name = "omega_kg"
version = "0.1.0"
description = "General-purpose Python project managed by Poetry"
authors = [
    {name = "SigmaDev11",email = "steynsean11@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "python-frontmatter >=1.1.0,<2.0.0",
    "pydantic-settings >=2.11.0,<3.0.0",
    "tabulate >=0.9.0,<1.0.0",
    "neo4j >=6.0.2,<7.0.0",
    "click >=8.0,<9.0",
    "fastapi >=0.120.0,<0.121.0",
    "uvicorn[standard] >=0.38.0,<0.39.0",
    "apscheduler >=3.11.0,<4.0.0"
]

[project.scripts]
omega = "omega_kg.cli:cli"
capture-server = "omega_kg.capture_server:main"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    { include = "omega_kg" }
]

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"
pre-commit = "^4.3.0"
black = "^25.9.0"
ruff = "^0.14.1"
ipython = "^9.6.0"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.22"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --junitxml=junit.xml"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.coverage.run]
source = ["omega_kg"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
