---
# ApexSigma Network Definition
# This network will be shared across all ApexSigma projects.
networks:
  apexsigma.net:
    driver: bridge
    name: apexsigma.net # Explicitly name the network for external access

# Persistent Data Volumes
# These volumes live outside the lifecycle of any single container.
volumes:
  neo4j-data: # Named volume for the Neo4j database files
    driver: local
    name: ${NEO4J_VOLUME_NAME:-apexsigma.neo4j.data} # configurable named volume via .env
  postgres-data: # Named volume for PostgreSQL database files
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-apexsigma.postgres.data} # configurable named volume via .env

services:
  # Neo4j Database Service
  # Phase 6: Graph Integration - Neo4j will be used for entity relationships
  # Currently deferred to focus on Linear sync foundation
  neo4j-db:
    image: neo4j:5-community
    container_name: ${NEO4J_CONTAINER_NAME:-apexsigma.neo4j.db} # Consistent, human-readable name (configurable via .env)
    restart: unless-stopped
    ports:
      # Expose ports to THE HOST MACHINE for external service access
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474" # HTTP host:container
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687" # Bolt host:container
    networks:
      - apexsigma.net
    volumes:
      - neo4j-data:/data # Persist the database data
    environment:
      # Pull configuration from .env file
      # NEVER hardcode credentials in the YAML file
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # Increase memory allocation for larger graphs
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_SIZE}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_SIZE}
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/7687"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Omega_KG Capture Service
  omega-kg:
    # Build from current directory
    build: .
    container_name: apexsigma.omega.kg
    # Don't auto-restart lifecycle container
    restart: "no"
    ports:
      # Webhook port
      - "8765:8765"
    networks:
      - apexsigma.net
    volumes:
      # Mount Obsidian vault from host into container
      - "${OBSIDIAN_VAULT_PATH}:/vault:ro"
    env_file:
      # Load environment variables from .env file
      - .env
    environment:
      # Override Neo4j URI to use Docker network hostname
      NEO4J_URI: bolt://neo4j-db:7687
    depends_on:
      neo4j-db:
        # Wait for Neo4j healthy before starting
        condition: service_healthy
    profiles:
      # On-demand execution only
      - lifecycle
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:8765/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL with pgvector Extension
  # Used for raw_linear_events persistence and processing queue
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: ${POSTGRES_CONTAINER_NAME:-apexsigma.postgres.db}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omega_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omega_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-omega_kg}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - apexsigma.net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omega_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

