version: 0.1
cli:
  version: 1.25.0
lint:
  enabled:
    - osv-scanner@2.2.3
    - ruff
    - isort
    - mypy
    - pyright
    - bandit
    - trivy
    - semgrep
    - markdownlint
    - yamllint
    - actionlint
    - prettier
    - shfmt
    - shellcheck
    - checkov
    - hadolint
    - trufflehog
    - codespell
    - gitleaks
runtimes:
  - go@1.19.5
  - node@18.12.1
  - python@3.10.8
plugins:
  sources:
    - id: trunk
      ref: v1.7.3
      uri: https://github.com/trunk-io/plugins
