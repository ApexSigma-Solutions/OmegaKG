    # Python linting via Poetry (not Trunk - Windows compatibility)
    - trivy@0.67.2
    - terrascan@1.19.1
    - taplo@0.10.0
    - svgo@4.0.0
    - shfmt@3.6.0
    - shellcheck@0.11.0
    - oxipng@9.1.5
    - osv-scanner@2.2.3
    - hadolint@2.14.0
    - checkov@3.2.488
    - black@25.9.0
    - actionlint@1.7.8
    - ruff@0.14.2
    - mypy@1.18.2
    - isort@7.0.0
    - bandit@1.8.6
    
    # Reliable cross-platform tools via Trunk
    - trufflehog@3.90.12
