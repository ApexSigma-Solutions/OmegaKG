version: 0.1
cli:
  version: 1.25.0
lint:
  # NOTE: Trunk tool management has issues on Windows
  # We use Poetry-managed linters instead (see pyproject.toml)
  # Python linting: poetry run ruff check, mypy, etc.
  # Run: poetry run pytest for testing
  enabled:
    # Only use git-diff-check (no external deps)
    - git-diff-check
