---
name: Pre-commit Infrastructure Checks
# Docker/shell-based infrastructure checks
# Run via: scripts/pre-commit-full.ps1 or in CI/CD

on:
  workflow_call: {}

jobs:
  infrastructure-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run infrastructure pre-commit checks
        run: |
          cat > .pre-commit-config-infra.yaml << 'EOF'
          repos:
            # Include all Python checks from main config
            - repo: https://github.com/astral-sh/ruff-pre-commit
              rev: v0.8.4
              hooks:
                - id: ruff
                  args: [--fix, --exit-non-zero-on-fix]
                - id: ruff-format

            # Dockerfile linting
            - repo: https://github.com/hadolint/hadolint
              rev: v2.12.0
              hooks:
                - id: hadolint-docker
                  args: [--ignore, DL3008, --ignore, DL3009]

            # Security scanning (Docker required)
            - repo: local
              hooks:
                - id: trivy-fs
                  name: Trivy filesystem scan
                  entry: |
                    docker run --rm \
                      -v /var/run/docker.sock:/var/run/docker.sock \
                      -v .:/workspace \
                      aquasec/trivy:latest fs \
                      --scanners vuln,secret,config /workspace
                  language: system
                  pass_filenames: false

                - id: docker-compose-validate
                  name: Validate docker-compose files
                  entry: docker compose -f docker-compose.yml config --quiet
                  language: system
                  files: docker-compose.*\.ya?ml$
                  pass_filenames: false
          EOF
          pre-commit run --config .pre-commit-config-infra.yaml --all-files
