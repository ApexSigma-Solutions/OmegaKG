site_name: Omega_KG Documentation
repo_url: https://github.com/ApexSigma-Solutions/omega_kg
repo_name: ApexSigma-Solutions/omega_kg
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
nav:
  - Home: index.md
  - Getting Started:
      - Beginner's Guide: GETTING_STARTED_BEGINNER.md
      - Installation: TESTING_SETUP.md
      - Configuration: SETTINGS_FIX.md
      - Neo4j Setup: NEO4J_SETUP.md
  - Documentation:
      - Development Standards: DEVELOPMENT_STANDARDS.md
      - API Reference: reference.md
      - Project Tree: Omega_KG.tree.md
  - Implementation:
      - Phase 3 Summary: PHASE_3_SUMMARY.md
      - Implementation Summary: IMPLEMENTATION_SUMMARY.md
      - Connection Recovery: CONNECTION_RECOVERY.md
  - Reports:
      - Test Report: TEST_REPORT.md
      - Test Report Summary: TEST_REPORT_SUMMARY.md
      - Completion Report: COMPLETION_REPORT.md
      - Final Verification: FINAL_VERIFICATION.md
      - Delivery Summary: DELIVERY_SUMMARY.md
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - pymdownx.magiclink
  - pymdownx.tasklist
  - pymdownx.tilde
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ApexSigma-Solutions/omega_kg
