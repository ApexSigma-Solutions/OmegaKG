[pytest]
# Minimum pytest version required for project compatibility
minversion = 7.0

# Test discovery configuration
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Core pytest options for better output and behavior
# -v: Verbose output
# --tb=short: Short traceback format
# --strict-markers: Enforce marker validation
# --strict-config: Enforce configuration validation
# --no-header: Suppress pytest header
# --color=yes: Enable colored output
# asyncio_mode: auto - automatically handles async test functions
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --no-header
    --color=yes
asyncio_mode = auto

# Environment files to load for tests
env_files =
    .env
    .env.test

# Test markers for selective test execution
# Usage: pytest -m "unit" or pytest -m "not integration"
markers =
    # Test categorization
    unit: unit tests - isolated, fast, no external dependencies
    integration: integration tests - require external services (Neo4j, Linear, etc.)
    slow: slow running tests - long execution time, use with -m "not slow"

    # Database dependency markers
    requires_neo4j: tests that require Neo4j database connection
    not_requires_neo4j: tests that do not require Neo4j database connection
    requires_postgres: tests that require PostgreSQL database connection

    # Service dependency markers
    requires_linear: tests requiring Linear API integration
    requires_obsidian: tests requiring Obsidian vault access
    requires_ollama: tests requiring Ollama service

    # Test type markers
    smoke: smoke tests - basic functionality verification
    regression: regression tests - comprehensive coverage
    performance: performance benchmarks and load tests
    security: security compliance and vulnerability tests

    # Development workflow markers
    e2e: end-to-end tests spanning multiple components
    mock: tests using mocked dependencies
    live: tests requiring live external services

# Test filtering and selection
# Use with: pytest -k "test_capture" or pytest -k "not slow"
filterwarnings =
    # Treat warnings as errors for stricter testing
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning

    # Ignore specific warnings that are not actionable
    ignore::UserWarning
    ignore:distutils Version classes are deprecated:DeprecationWarning

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables to ensure proper path resolution
env =
    PYTHONPATH=.
    WORKSPACE_ROOT=d:\\projects\\Omega_KG_dev
