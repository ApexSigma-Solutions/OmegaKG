<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; font-family: sans-serif; padding: 10px; }
    button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; background: #333; color: #fff; border: none; }
    button:hover { background: #555; }
    #status { margin-top: 10px; font-size: 12px; color: #666; word-wrap: break-word; }
    input { width: 100%; padding: 5px; box-sizing: border-box; margin-bottom: 5px; }
    .hidden { display: none; }
    #settings-area { margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px; }
  </style>
</head>
<body>
  <h3>Omega_KG Capture</h3>

  <div id="main-area">
    <button id="captureBtn">📸 Capture Page</button>
    <div id="status">Ready.</div>
  </div>

  <div id="settings-area">
    <small>API Key:</small>
    <input type="password" id="apiKeyInput" placeholder="Paste API Key here">
    <button id="saveKeyBtn">Save Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
