<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega_KG Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .label-helper {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: normal;
            margin-top: 4px;
        }

        input[type="text"],
        input[type="password"],
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', monospace;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-group input {
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #f5f5f5;
            color: #666;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
        }

        .info-box strong {
            color: #667eea;
        }

        .field-status {
            font-size: 12px;
            margin-top: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .field-status.saved {
            background: #d4edda;
            color: #155724;
        }

        .field-status.unsaved {
            background: #fff3cd;
            color: #856404;
        }

        .field-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .icon {
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Omega_KG Setup</h1>
            <p>Configure secure authentication for conversation capture</p>
        </div>

        <div class="info-box">
            <strong>ℹ️ How it works:</strong> Enter your bootstrap API key below. The extension will securely exchange
            it for short-lived tokens to capture conversations.
        </div>

        <form id="configForm">
            <div class="form-group">
                <label for="apiKey">
                    Bootstrap API Key
                    <span class="label-helper">Your extension's static API key from Omega_KG server config</span>
                </label>
                <input type="password" id="apiKey" name="apiKey" placeholder="Enter your API key"
                    required autocomplete="off">
                <div class="field-status" id="apiKeyStatus"></div>
            </div>

            <div class="form-group">
                <label for="serverUrl">
                    Server URL
                    <span class="label-helper">Base URL of your Omega_KG capture server</span>
                </label>
                <input type="url" id="serverUrl" name="serverUrl" placeholder="http://localhost:8765"
                    value="http://localhost:8765" required>
                <div class="field-status" id="serverUrlStatus"></div>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <div class="button-group">
                <button type="submit" class="btn-save" id="saveBtn">
                    <span class="icon">💾</span>Save Configuration
                </button>
                <button type="button" class="btn-clear" id="clearBtn">
                    <span class="icon">🗑️</span>Clear
                </button>
            </div>
        </form>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #999;">
            <p>v1.2.0 • <a href="https://github.com/ApexSigma-Solutions/omega_kg" target="_blank"
                    style="color: #667eea; text-decoration: none;">GitHub</a></p>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
